# Builds release binaries for every tag that starts with "v" and attaches them to the GitHub Release.
# Linux builds run inside rust:bullseye (glibc 2.31) so the binary runs on Ubuntu 20.04+ / Debian 11+.
# "Run workflow" (workflow_dispatch) builds the same artifacts without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: rust:bullseye
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: rust:bullseye
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: rustup update stable && rustup default stable && rustc --version

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/kestrel examples/aot_check.ts

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="kestrel-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/kestrel README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          rm -r "$name"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
